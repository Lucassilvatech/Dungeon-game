server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /admin { try_files /admin.html =404; }
    location /admin/ { try_files /admin.html =404; }
    location / { try_files $uri /index.html; }
    location /api/ { proxy_pass http://backend:8000/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 60s; }
}
