services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tower
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes: [tower_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tower -d tower]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tower:${POSTGRES_PASSWORD}@db:5432/tower
      INITIAL_TREASURY: ${INITIAL_TREASURY:-100000}
      MONSTER_REWARD: ${MONSTER_REWARD:-10}
      BOSS_REWARD: ${BOSS_REWARD:-100}
      DAMAGE_MIN: ${DAMAGE_MIN:-2}
      DAMAGE_MAX: ${DAMAGE_MAX:-999}
      SKILL_BONUS: ${SKILL_BONUS:-5}
      GUARD_BONUS: ${GUARD_BONUS:-4}
      WANDER_INTERVAL: ${WANDER_INTERVAL:-4}
      SECRET_CHANCE: ${SECRET_CHANCE:-0.25}
      SECRET_FIRST_REWARD: ${SECRET_FIRST_REWARD:-250}
      SECRET_REPEAT_REWARD: ${SECRET_REPEAT_REWARD:-1}
      MEDICAL_FEE_BASE: ${MEDICAL_FEE_BASE:-100}
      RESPAWN_HP_PERCENT: ${RESPAWN_HP_PERCENT:-100}
      MIN_AUCTION_START_PRICE: ${MIN_AUCTION_START_PRICE:-1}
      AUCTION_DURATION_HOURS: ${AUCTION_DURATION_HOURS:-24}
      AUCTION_PROCEEDS_DESTINATION: ${AUCTION_PROCEEDS_DESTINATION:-treasury}
      AUCTION_SWEEP_SECONDS: ${AUCTION_SWEEP_SECONDS:-30}
      DISCORD_SERVICE_KEY: ${DISCORD_SERVICE_KEY:-}
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: {condition: service_healthy}
  discord:
    profiles: [discord]
    build: ./discord-bot
    environment:
      API_URL: http://backend:8000
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_SERVICE_KEY: ${DISCORD_SERVICE_KEY:-}
    depends_on:
      backend: {condition: service_healthy}
volumes:
  tower_data:
