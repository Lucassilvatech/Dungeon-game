# Optional isolated development test server. Never connects to tower_data.
services:
  visual-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visual_test
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: visual-test-only
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tower -d visual_test"]
      interval: 2s
      timeout: 3s
      retries: 30
